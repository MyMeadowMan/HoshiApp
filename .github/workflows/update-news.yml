name: Update news
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-news
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch news
        run: python fetch_news.py
      - name: Save changes
        run: |
          git config user.name "hoshi-bot"
          git config user.email "hoshi-bot@users.noreply.github.com"
          git add news.json
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "Update news" && git push; fi
