<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Hoshi 星 – anime and manga hub</title>
<meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://graphql.anilist.co https://api.github.com; base-uri 'none'; form-action 'none'; object-src 'none'; worker-src 'self'; manifest-src 'self'"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Hoshi"><meta name="apple-mobile-web-app-status-bar-style" content="black"><meta name="theme-color" content="#0d0b1e"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&family=Shippori+Mincho:wght@700;800&display=swap">
<style>
:root{--bg:#0a0914;--card:rgba(255,255,255,.06);--line:rgba(255,255,255,.1);--tx:#f4f0ff;--mu:#a29cc4;--a:#a07bff;--b:#ff6fa5;--c:#ffc27a;--glass:rgba(14,12,32,.78);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#faf7ff;--card:rgba(70,40,130,.06);--line:rgba(70,40,130,.14);--tx:#1b1533;--mu:#6d6590;--glass:rgba(250,247,255,.85);color-scheme:light}}
:root[data-theme="light"]{--bg:#faf7ff;--card:rgba(70,40,130,.06);--line:rgba(70,40,130,.14);--tx:#1b1533;--mu:#6d6590;--glass:rgba(250,247,255,.85);color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;-webkit-text-size-adjust:100%}
body{background:radial-gradient(120% 60% at 85% -10%,color-mix(in srgb,var(--a) 38%,transparent),transparent 60%),radial-gradient(90% 50% at -10% 105%,color-mix(in srgb,var(--b) 28%,transparent),transparent 60%),var(--bg);color:var(--tx);font:400 14px/1.45 Sora,system-ui,sans-serif}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
#app{max-width:480px;height:100%;margin:auto;display:flex;flex-direction:column;position:relative}
header{padding:12px 16px 8px;display:flex;align-items:center;gap:10px}
.logo{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;font:800 20px 'Shippori Mincho',serif;color:#fff;background:linear-gradient(140deg,var(--a),var(--b));box-shadow:0 6px 22px color-mix(in srgb,var(--b) 45%,transparent)}
h1{font:800 22px/1 'Shippori Mincho',serif;margin:0;letter-spacing:.02em}
.sync{font-size:11px;color:var(--mu);display:flex;align-items:center;gap:6px;margin-top:4px}
.sync i{width:7px;height:7px;border-radius:50%;background:#5eead4;box-shadow:0 0 0 0 #5eead4aa;animation:pl 2.4s infinite}
@keyframes pl{70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
.hr{margin-left:auto;display:flex;gap:8px;align-items:center}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:3px;position:relative}
.seg button{padding:5px 11px;border-radius:99px;font-size:12px;font-weight:600;color:var(--mu);position:relative;z-index:1;transition:color .25s}
.seg button.on{color:#fff}
.seg b{position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);border-radius:99px;background:linear-gradient(120deg,var(--a),var(--b));transition:transform .35s cubic-bezier(.5,1.5,.5,1)}
.seg.jp b{transform:translateX(100%)}
.ic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);transition:.25s}
.ic.on{background:linear-gradient(130deg,var(--a),var(--b));border-color:transparent;color:#fff}
.ic svg,#tabs svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
main{flex:1;min-height:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;overscroll-behavior-x:contain;scrollbar-width:none}
.pane{overscroll-behavior-y:none;flex:none;width:100%;height:100%;overflow-y:auto;scroll-snap-align:start;padding:6px 16px 90px;scrollbar-width:none;-webkit-overflow-scrolling:touch;contain:layout style}
main::-webkit-scrollbar,.pane::-webkit-scrollbar{display:none}
h2{font:800 26px/1.1 'Shippori Mincho',serif;margin:10px 0 12px}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 14px;padding:0 16px;scrollbar-width:none}
.chip{flex:none;padding:7px 14px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-size:12.5px;font-weight:600;color:var(--mu);transition:.25s}
.chip.on{color:#fff;border-color:transparent;background:linear-gradient(120deg,var(--a),var(--b))}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;margin-bottom:12px;position:relative;overflow:hidden}
.card.hot{border-color:color-mix(in srgb,var(--c) 60%,transparent);box-shadow:0 0 30px -8px var(--c)}
.meta{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--mu);margin-bottom:8px;flex-wrap:wrap}
.src{font-weight:800;color:var(--tx)}
.tag{padding:2px 9px;border-radius:99px;background:color-mix(in srgb,var(--a) 25%,transparent);font-weight:600;color:var(--tx)}
.tag.br{background:linear-gradient(120deg,var(--c),var(--b));color:#1b1020}
.tr{margin-left:auto;font-size:10.5px;font-weight:600;padding:3px 10px;border-radius:99px;border:1px solid var(--a);color:var(--tx);text-decoration:none}
.hl{font-size:16px;font-weight:600;line-height:1.35;margin:0}
.hl.jp{font-family:'Shippori Mincho',serif;font-weight:700;font-size:17px}
.fade{animation:fd .35s}
@keyframes fd{from{opacity:0;transform:translateY(5px)}}
.spo{position:absolute;inset:0;background:var(--bg);display:grid;place-content:center;text-align:center;gap:4px;font-size:12.5px;color:var(--mu);z-index:2}
.spo b{color:var(--tx);font-size:14px}
.stats{display:flex;gap:10px;margin-bottom:14px}
.stat{flex:1;text-align:center;padding:10px 4px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.stat b{display:block;font:800 22px 'Shippori Mincho',serif;background:linear-gradient(120deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
.stat span{font-size:11px;color:var(--mu)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.lc{animation:fd .4s backwards}
.lc.pop{animation:pop .9s cubic-bezier(.2,.8,.2,1)}
@keyframes pop{0%{transform:translateY(16px) scale(.94);opacity:0}100%{transform:none;opacity:1}}
.cw{position:relative;border-radius:18px;overflow:hidden;aspect-ratio:2/3;box-shadow:0 8px 14px -8px #000c;width:100%;display:block;transition:transform .3s}
.cw:active{transform:scale(.97) rotate(-1deg)}
.cov{--h:260;position:absolute;inset:0;background:linear-gradient(155deg,hsl(var(--h) 72% 54%),hsl(calc(var(--h) + 55) 68% 20%));display:flex;flex-direction:column;justify-content:flex-end;padding:10px;color:#fff}
.cov::before{content:attr(data-g);position:absolute;top:-6px;right:2px;font:800 96px/1 'Shippori Mincho',serif;opacity:.22}
.cov::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 40%,#fff3 50%,transparent 60%);opacity:.5}
@keyframes sh{60%,100%{transform:translateX(100%)}}
.cov span{font-weight:700;font-size:13px;line-height:1.2;position:relative;text-shadow:0 2px 8px #0008}
.st{position:absolute;top:8px;left:8px;font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--glass);color:var(--tx);z-index:1}
.ring{position:absolute;right:8px;bottom:8px;width:42px;height:42px;border-radius:50%;background:var(--glass);display:grid;place-items:center;z-index:1}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:3.5;stroke-linecap:round}
.ring .bg{stroke:#fff3}
.ring .fg{stroke:url(#g);stroke-dasharray:113;transition:stroke-dashoffset .7s cubic-bezier(.3,1.3,.5,1)}
.ring b{font-size:17px;font-weight:600;position:relative}
.lt{font-size:12.5px;margin:7px 2px 0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ls{font-size:11px;color:var(--mu);margin:0 2px}
.fab{position:absolute;right:18px;bottom:94px;z-index:5;width:56px;height:56px;border-radius:20px;background:linear-gradient(140deg,var(--a),var(--b));color:#fff;font-size:30px;box-shadow:0 12px 30px -6px var(--b);transition:transform .3s}
.fab:active{transform:scale(.88) rotate(90deg)}
.av{width:46px;height:46px;border-radius:16px;display:grid;place-items:center;font:800 18px 'Shippori Mincho',serif;color:#fff;flex:none}
.pr{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.pr b{display:block;font-size:15px}
.pr small{color:var(--mu);font-size:12px}
.pl{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto;justify-content:flex-end}
.pf{font-size:10.5px;padding:2px 8px;border-radius:8px;background:var(--card);border:1px solid var(--line)}
.pf.q{border-style:dashed;color:var(--mu)}
.post{font-size:13.5px;margin:0;padding:10px 12px;border-radius:14px;background:var(--card);border-left:3px solid var(--b)}
.post.jp{font-family:'Shippori Mincho',serif;font-weight:700;font-size:15px}
.paste{display:flex;gap:8px;margin-bottom:14px}
input,textarea{flex:1;min-width:0;font:inherit;font-size:16px;color:var(--tx);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 14px;outline:none}
input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--a);outline-offset:2px}
.btn{padding:11px 18px;border-radius:14px;font-weight:700;color:#fff;background:linear-gradient(120deg,var(--a),var(--b))}
.day{font:800 17px 'Shippori Mincho',serif;margin:16px 0 8px}
.ev{display:flex;gap:12px;align-items:center;padding:10px;border-radius:18px;background:var(--card);border:1px solid var(--line);margin-bottom:8px}
.ev .cw{width:44px;border-radius:12px;flex:none;box-shadow:none}
.ev .cov{padding:0}.ev .cov span{display:none}.ev .cov::before{font-size:44px;top:2px;right:6px}
.ev b{font-size:14px}.ev small{display:block;color:var(--mu);font-size:11.5px}
.eta{margin-left:auto;font:800 15px 'Shippori Mincho',serif;padding:6px 11px;border-radius:12px;background:color-mix(in srgb,var(--a) 22%,transparent);white-space:nowrap}
.eta.soon{background:linear-gradient(120deg,var(--c),var(--b));color:#1b1020}
#tabs{touch-action:none;display:flex;position:absolute;left:12px;right:12px;bottom:calc(8px + env(safe-area-inset-bottom,0px));background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:26px;padding:6px;z-index:6;box-shadow:0 14px 40px -10px #000c}
#tabs>button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:600;padding:8px 0;color:var(--tx);opacity:calc(.5 + var(--o,0)*.5);position:relative;z-index:1}
#tabs>button svg{transform:scale(calc(1 + var(--o,0)*.15))}
#ind{position:absolute;top:6px;bottom:6px;left:6px;width:calc(20% - 2.4px);border-radius:20px;background:linear-gradient(180deg,rgba(255,255,255,.26),rgba(255,255,255,.07));backdrop-filter:blur(8px) saturate(1.8);-webkit-backdrop-filter:blur(8px) saturate(1.8);border:1px solid rgba(255,255,255,.3);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 8px 20px -8px var(--a);will-change:transform;transition:scale .25s}
.sheetbg{position:fixed;inset:0;background:#000a;z-index:20;animation:fo .25s}
@keyframes fo{from{opacity:0}}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:auto;max-height:86%;overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:28px 28px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom,0px));z-index:21;animation:up .4s cubic-bezier(.2,1.1,.4,1)}
@keyframes up{from{transform:translateY(100%)}}
.grab{width:40px;height:4px;border-radius:9px;background:var(--line);margin:0 auto 14px}
.stars{display:flex;gap:6px;margin:10px 0}
.stars button{font-size:34px;line-height:1;color:var(--line);transition:color .2s}
.stars button.on{color:var(--c);text-shadow:0 0 18px var(--c)}
.row{display:flex;align-items:center;gap:12px;padding:8px 0}
.row .cw{width:46px;border-radius:12px;flex:none;box-shadow:none}
.row .cov{padding:0}.row .cov span{display:none}.row .cov::before{font-size:46px;top:2px;right:4px}
.row b{display:block}.row small{color:var(--mu)}.row .btn{margin-left:auto;padding:8px 16px}
.cf{position:fixed;width:8px;height:12px;border-radius:2px;z-index:50;pointer-events:none}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-width:88%;padding:11px 18px;border-radius:16px;background:var(--glass);backdrop-filter:blur(16px);border:1px solid var(--line);font-weight:600;font-size:13px;z-index:40;animation:fd .3s}
.note{color:var(--mu);font-size:12px;text-align:center;margin:18px 0}
.lsw{position:relative;display:flex;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:4px;margin:0 0 14px}
.lsw b{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:14px;background:linear-gradient(120deg,var(--a),var(--b));box-shadow:0 6px 18px -6px var(--b);transition:transform .3s cubic-bezier(.4,1.3,.5,1)}
.lsw.mg b{transform:translateX(100%)}
.lsw button{flex:1;position:relative;padding:9px;font-weight:700;font-size:14px;color:var(--mu);transition:color .25s}
.lsw button.on{color:#fff}
.vb{position:absolute;top:8px;right:8px;font-size:10px;font-weight:800;padding:3px 8px;border-radius:99px;background:linear-gradient(120deg,var(--a),var(--b));color:#fff;z-index:1}
.vb:empty{display:none}
#tabs.drag #ind{scale:1.14}
button,#tabs,header,.cw,.stat,.sn,.lt,.ls{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.gw{position:sticky;top:0;margin:-10px -18px 8px;padding:12px 18px 8px;background:var(--bg);z-index:2;display:flex;justify-content:center;align-items:center;touch-action:none}
.gw .grab{margin:0}
.done{position:absolute;right:14px;top:8px;font-weight:700;color:var(--b);padding:6px 6px}
.ep{position:relative}
.st{display:none!important}
.lc[data-s="Completed"] .cw{box-shadow:0 0 0 2px #ffc27a,0 0 22px -6px #ffc27a}
.lc[data-s="Completed"] .cw::after{content:"✓";position:absolute;top:8px;left:8px;width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,#ffe29a,#ffb347);color:#4a2a00;display:grid;place-items:center;font-weight:800;font-size:13px;z-index:1}
.lc[data-s="Watching"] .cw::after,.lc[data-s="Reading"] .cw::after{content:"";position:absolute;inset:0;border-radius:18px;box-shadow:inset 0 0 0 2px var(--b),inset 0 0 22px -4px var(--b);animation:bp 2.4s ease-in-out infinite;z-index:1;pointer-events:none}
@keyframes bp{50%{opacity:.35}}
.lc[data-s="Plan"] .cov{filter:saturate(.3) brightness(.75)}
.lc[data-s="Plan"] .cw::after{content:"";position:absolute;inset:6px;border-radius:13px;border:2px dashed #fff7;z-index:1;pointer-events:none}
.lc[data-s="On hold"] .cov{filter:saturate(.55) brightness(.85)}
.lc[data-s="Dropped"] .cov{filter:grayscale(1) brightness(.6)}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;margin:12px 2px;font-size:12px;color:var(--mu)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.bar{display:flex;height:12px;border-radius:99px;overflow:hidden;margin:10px 0 6px;background:var(--card)}
.tw{animation:tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes tw{50%{opacity:.5;transform:scale(1.3)}}
.pu{animation:pu 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pu{50%{transform:scale(1.15);opacity:.8}}
.dp{stroke-dasharray:1;stroke-dashoffset:1;animation:dr 2.8s .2s cubic-bezier(.3,.6,.2,1) forwards}
@keyframes dr{to{stroke-dashoffset:0}}
.ss{animation:ss 11s linear 2s infinite;opacity:0}
@keyframes ss{0%{transform:translate(0,0);opacity:0}1.5%{opacity:1}6%{transform:translate(150px,86px);opacity:0}100%{opacity:0}}
.bds{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.bd{text-align:center;padding:12px 6px;border-radius:18px;background:var(--card);border:1px solid var(--line);opacity:.5}
.bd svg{width:26px;height:26px;fill:var(--mu)}
.bd b{display:block;font-size:12px;margin-top:4px}
.bd small{font-size:10px;color:var(--mu)}
.bd.on{opacity:1;border-color:#ffd08a88;box-shadow:0 0 22px -8px #ffd08a}
.bd.on svg{fill:#ffd08a;filter:drop-shadow(0 0 5px #ffd08a)}
.hm{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-columns:1fr;grid-auto-flow:column;gap:3px;margin:12px 0 6px}
.hm i{aspect-ratio:1;border-radius:3px;background:linear-gradient(135deg,var(--a),var(--b))}
.gb{display:flex;align-items:center;gap:10px;margin:10px 0 0;font-size:12px}
.gb span{width:78px;color:var(--mu)}
.nl{transform-box:fill-box;transform-origin:50% 100%;opacity:0;animation:lf .9s cubic-bezier(.2,.8,.2,1) forwards paused}
.jv .nl,.jv .br{animation-play-state:running}
@keyframes lf{0%{opacity:0;transform:scale(0) rotate(-25deg)}100%{opacity:1;transform:none}}
.br{stroke-dasharray:1;stroke-dashoffset:1;animation:dr 1.4s cubic-bezier(.3,.6,.2,1) forwards paused}
.pt{animation:fall 14s linear infinite}
@keyframes fall{0%{transform:translate(0,-20px) rotate(0);opacity:0}10%{opacity:.85}100%{transform:translate(-50px,420px) rotate(300deg);opacity:0}}
.cl{animation:cd 40s linear infinite alternate}
@keyframes cd{to{transform:translateX(50px)}}
#tsvg{-webkit-user-select:none;user-select:none;touch-action:pan-y}
.zc{position:absolute;top:10px;right:10px;display:flex;flex-direction:column;gap:6px;z-index:3}
.zc button{width:34px;height:34px;border-radius:50%;background:var(--glass);border:1px solid rgba(255,255,255,.2);font-size:18px;color:var(--tx)}
.tinfo{display:flex;flex-direction:column;gap:2px;padding:12px 16px;background:var(--glass);border-top:1px solid var(--line);font-size:13px}
.tinfo span{color:var(--mu);font-size:12px}
.lb{opacity:0;transition:opacity .3s;font:600 4.6px Sora,sans-serif;paint-order:stroke;stroke:#0b0d25;stroke-width:1.2px;fill:#fff;pointer-events:none}
#tsvg.z .lb{opacity:1}
.bs{cursor:pointer;transition:opacity .25s}
.kr{display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:16px;background:var(--card);border:1px solid var(--line);margin-bottom:8px;-webkit-user-select:none;user-select:none}
.kr b{display:block;font-size:13.5px}
.kr small{color:var(--mu);font-size:11.5px}
.kr svg{flex:none}
.sw{flex:none;width:52px;height:20px;border-radius:99px;border:1px solid rgba(255,255,255,.25)}
.hv{position:relative;overflow:hidden}
#hvc{width:100%;aspect-ratio:1/1.05;display:block;touch-action:pan-y}
.hvt,.hvr{position:absolute;display:flex;align-items:center;gap:4px;padding:3px 6px;border-radius:99px;background:rgba(10,14,28,.6);border:1px solid rgba(255,255,255,.2);color:#fff;z-index:3;-webkit-user-select:none;user-select:none}
.hvt{top:10px;left:10px}
.hvr{top:10px;right:10px}
.hvt button,.hvr button{color:#fff;padding:5px 8px;font-weight:700;font-size:12px}
.hvt b{font-size:12px;min-width:84px;text-align:center}
#hvx{position:fixed;inset:0;z-index:70;background:#000;touch-action:none}
#hvf{width:100%;height:100%;display:block;touch-action:none}
#hvx .hvt,#hvx .hvr{top:calc(10px + env(safe-area-inset-top,0px))}
.hvcl{position:absolute;right:14px;bottom:calc(92px + env(safe-area-inset-bottom,0px));width:40px;height:40px;border-radius:50%;background:rgba(10,14,28,.7);border:1px solid rgba(255,255,255,.25);color:#fff;font-size:16px;z-index:3}
